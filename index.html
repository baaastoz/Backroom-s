<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Backrooms: Yellow Shift - Prototype V2</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, Avenir, Helvetica, Arial, sans-serif;
      }

      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #161616;
      }

      #app {
        width: 100%;
        height: 100%;
        position: relative;
      }

      #ui {
        position: absolute;
        top: 16px;
        left: 16px;
        z-index: 2;
        padding: 10px 12px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        background: rgba(0, 0, 0, 0.45);
        max-width: 420px;
      }

      #ui p,
      #ui div {
        margin: 0 0 8px;
        font-size: 14px;
      }

      #fuses {
        color: #ffe66d;
      }

      #spawn-rules {
        margin-bottom: 0;
        color: #b6d6ff;
        font-size: 12px;
      }

      #hint {
        margin-top: 8px;
        opacity: 0.8;
        font-size: 12px;
      }

      #crosshair {
        position: absolute;
        inset: 50% auto auto 50%;
        transform: translate(-50%, -50%);
        font-size: 16px;
        z-index: 2;
        opacity: 0.75;
      }

      #lock-overlay {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        z-index: 3;
        background: rgba(0, 0, 0, 0.45);
      }

      #lock-overlay button {
        border: 1px solid #999;
        background: #1f1f1f;
        color: #fff;
        padding: 10px 14px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="ui">
        <p id="objective">Objective: Find and collect all 3 fuses (press E near a fuse).</p>
        <p id="fuses">Fuses: 0 / 3</p>
        <p id="zone">Zone: Safe Spawn / Yellow Lobby</p>
        <p id="protection">Safe Spawn Protection: 25.0s</p>
        <p id="spawn-rules">Spawn Validator: waiting...</p>
        <div id="hint">WASD: Move • Shift: Sprint • E: Interact</div>
      </div>
      <div id="crosshair">+</div>
      <div id="lock-overlay">
        <button id="start-button">Click to Begin (Pointer Lock)</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
